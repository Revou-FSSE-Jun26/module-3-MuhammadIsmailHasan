<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Home | RevoShop</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="../dist/output.css" />
	</head>
	<body class="bg-slate-50 text-slate-900 font-sans antialiased">
		<header
			class="sticky top-0 z-10 bg-white/80 backdrop-blur border-b border-slate-200"
		>
			<div
				class="max-w-6xl mx-auto px-4 md:px-8 h-14 flex items-center justify-between"
			>
				<a href="#" class="text-lg font-extrabold text-brand-900">
					Revo<span class="text-brand-500">Shop</span>
				</a>
				<a
					href="#"
					class="inline-flex items-center gap-2 min-h-11 px-4 rounded-full bg-brand-50 text-brand-700 text-sm font-semibold hover:bg-brand-100"
				>
					Cart
					<span
						id="cart-count"
						class="grid place-items-center min-w-5 h-5 px-1 rounded-full bg-brand-600 text-white text-xs"
						>0</span
					>
				</a>
			</div>
		</header>

		<main class="max-w-6xl mx-auto px-4 md:px-8 py-6 md:py-12">
			<section
				class="rounded-3xl bg-gradient-to-br from-brand-600 to-brand-900 text-white p-6 md:p-12"
			>
				<p
					class="text-xs font-semibold uppercase tracking-widest text-brand-100"
				>
					Catalog
				</p>
				<h1
					class="mt-2 text-4xl md:text-6xl font-extrabold tracking-tight"
				>
					All products
				</h1>
				<p class="mt-2 text-brand-100 md:text-lg max-w-md">
					Find something you'll love, from everyday picks to new
					arrivals.
				</p>
			</section>

			<section
				aria-label="Search and filter"
				class="mt-6 flex flex-col gap-3 md:grid md:grid-cols-[minmax(0,2fr)_minmax(0,1fr)_auto] md:items-center md:gap-4"
			>
				<div>
					<label for="search" class="sr-only">Search</label>
					<input
						id="search"
						type="search"
						placeholder="Search products"
						class="w-full min-h-11 px-5 rounded-full bg-white shadow-sm ring-1 ring-slate-200 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500"
					/>
				</div>
				<div>
					<label for="sort" class="sr-only">Sort by</label>
					<select
						id="sort"
						class="w-full min-h-11 pl-5 pr-11 appearance-none rounded-full bg-white select-arrow shadow-sm ring-1 ring-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500"
					>
						<option value="newest">Newest</option>
						<option value="price-asc">Price: low to high</option>
						<option value="price-desc">Price: high to low</option>
						<option value="name">Name A–Z</option>
					</select>
				</div>
				<label
					for="in-stock"
					class="inline-flex items-center gap-2 min-h-11 text-sm font-semibold cursor-pointer"
				>
					<input
						id="in-stock"
						type="checkbox"
						class="w-5 h-5 rounded accent-brand-600"
					/>
					In stock only
				</label>
			</section>

			<div
				id="categories"
				role="group"
				aria-label="Category"
				class="mt-4 flex gap-2 overflow-x-auto pb-2 -mx-4 px-4 md:mx-0 md:px-0 md:flex-wrap"
			></div>

			<p id="count" role="status" class="py-4 text-sm text-slate-500"></p>

			<div
				id="grid"
				class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6"
			></div>

			<div
				id="empty"
				hidden
				class="rounded-3xl bg-white ring-1 ring-slate-200 p-8 text-center flex flex-col items-center gap-3"
			>
				<h2 class="text-2xl font-extrabold">No products match</h2>
				<p class="text-slate-500">
					Try another search term or clear the filters.
				</p>
				<button
					id="clear"
					type="button"
					class="min-h-11 px-6 rounded-full bg-brand-600 text-white font-semibold hover:bg-brand-700 active:scale-95 transition"
				>
					Clear filters
				</button>
			</div>
		</main>

		<script type="module" src="../dist/app.js"></script>
	</body>
</html>
